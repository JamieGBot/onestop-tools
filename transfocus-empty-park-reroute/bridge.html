<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Transfocus Empty Park Reroute Loader</title>
</head>
<body style="font-family:Arial,sans-serif;font-size:13px;padding:12px">
Loading latest Empty Park Reroute…
<script>
(async () => {
  const TYPE = "JAMIE_EMPTY_PARK_REROUTE_SOURCE_V1";

  try {
    const params = new URLSearchParams(location.search);
    const target = params.get("origin") || "";

    if (!/^https:\/\/[^/]*tmspanel\.com\.au$/i.test(target)) {
      throw new Error("Invalid Transfocus origin.");
    }

    /*
     * Fetch from this GitHub Pages site itself instead of raw.githubusercontent.
     * This avoids the cross-origin/raw response issue that was causing atob() to
     * receive something other than the expected base64 payload.
     */
    const payloadUrl =
      new URL("latest.txt?v=" + Date.now(), location.href).href;

    const response = await fetch(payloadUrl, {
      cache: "no-store",
      credentials: "omit"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    let payload = await response.text();

    /* Remove BOM/whitespace and only keep legal base64 characters. */
    payload = String(payload || "")
      .replace(/^\uFEFF/, "")
      .replace(/\s+/g, "")
      .replace(/[^A-Za-z0-9+/=]/g, "");

    if (!payload || payload.length < 1000) {
      throw new Error("Remote payload looked incomplete.");
    }

    /* Repair missing padding if a proxy strips it. */
    const remainder = payload.length % 4;
    if (remainder) {
      payload += "=".repeat(4 - remainder);
    }

    let binary;
    try {
      binary = atob(payload);
    } catch (error) {
      throw new Error(
        "Base64 decode failed (length " + payload.length + "): " +
        (error && error.message ? error.message : error)
      );
    }

    const bytes =
      Uint8Array.from(
        binary,
        character => character.charCodeAt(0)
      );

    if (typeof DecompressionStream !== "function") {
      throw new Error("DecompressionStream unavailable.");
    }

    const source =
      await new Response(
        new Blob([bytes])
          .stream()
          .pipeThrough(
            new DecompressionStream("gzip")
          )
      ).text();

    if (!source || source.length < 5000) {
      throw new Error("Decoded source looked incomplete.");
    }

    if (!window.opener) {
      throw new Error("Original Transfocus window is unavailable.");
    }

    window.opener.postMessage(
      {
        type: TYPE,
        source
      },
      target
    );

    document.body.textContent = "Loaded. You can close this window.";
    setTimeout(() => window.close(), 250);
  } catch (error) {
    console.error(error);

    document.body.textContent =
      "Loader failed: " +
      (error && error.message ? error.message : error);

    try {
      const target =
        new URLSearchParams(location.search).get("origin") || "*";

      window.opener?.postMessage(
        {
          type: TYPE,
          error:
            error && error.message
              ? error.message
              : String(error)
        },
        target
      );
    } catch (_) {}
  }
})();
</script>
</body>
</html>
