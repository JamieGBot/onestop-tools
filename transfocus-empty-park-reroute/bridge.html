<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Transfocus Empty Park Reroute Loader</title>
</head>
<body style="font-family:Arial,sans-serif;font-size:13px;padding:12px">
Loading latest Empty Park Reroute…
<script>
(async () => {
  const TYPE = "JAMIE_EMPTY_PARK_REROUTE_SOURCE_V1";

  function decodeBase64(text) {
    let payload = String(text || "")
      .replace(/^\uFEFF/, "")
      .replace(/\s+/g, "")
      .replace(/-/g, "+")
      .replace(/_/g, "/");

    const remainder = payload.length % 4;
    if (remainder === 1) {
      throw new Error(
        "Remote payload is corrupted (base64 length " + payload.length + ")."
      );
    }

    if (remainder) {
      payload += "=".repeat(4 - remainder);
    }

    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(payload)) {
      throw new Error(
        "Remote payload contains invalid base64 characters."
      );
    }

    if (typeof Uint8Array.fromBase64 === "function") {
      return Uint8Array.fromBase64(payload);
    }

    const binary = atob(payload);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i += 1) {
      bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
  }

  try {
    const params = new URLSearchParams(location.search);
    const target = params.get("origin") || "";

    if (!/^https:\/\/[^/]*tmspanel\.com\.au$/i.test(target)) {
      throw new Error("Invalid Transfocus origin.");
    }

    const response = await fetch(
      "./latest.txt?v=" + Date.now(),
      {
        cache: "no-store",
        credentials: "omit"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const encoded = await response.text();

    if (!encoded || encoded.length < 1000) {
      throw new Error("Remote payload looked incomplete.");
    }

    const bytes = decodeBase64(encoded);

    if (typeof DecompressionStream !== "function") {
      throw new Error("DecompressionStream unavailable.");
    }

    const source = await new Response(
      new Blob([bytes])
        .stream()
        .pipeThrough(
          new DecompressionStream("gzip")
        )
    ).text();

    if (
      !source ||
      source.length < 5000 ||
      !source.includes("STANDALONE NIGHT SHIFT EMPTY PARK REROUTE V8")
    ) {
      throw new Error("Decoded source looked incomplete or incorrect.");
    }

    if (!window.opener) {
      throw new Error("Original Transfocus window is unavailable.");
    }

    window.opener.postMessage(
      {
        type: TYPE,
        source
      },
      target
    );

    document.body.textContent = "Loaded. You can close this window.";
    setTimeout(() => window.close(), 250);
  } catch (error) {
    console.error(error);

    document.body.textContent =
      "Loader failed: " +
      (error && error.message ? error.message : error);

    try {
      const target =
        new URLSearchParams(location.search).get("origin") || "*";

      window.opener?.postMessage(
        {
          type: TYPE,
          error:
            error && error.message
              ? error.message
              : String(error)
        },
        target
      );
    } catch (_) {}
  }
})();
</script>
</body>
</html>
